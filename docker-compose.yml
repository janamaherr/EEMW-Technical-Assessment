# Document Repository: the whole stack.
#
#   docker compose up -d --build      # postgres + redis + backend + frontend
#   docker compose up -d postgres redis   # only the databases, for local `npm run dev`
#
# Every value has a default, so this works without a .env file. Override any of them in a root
# .env (see .env.example).
name: docrepo

services:
  postgres:
    image: postgres:16
    container_name: docrepo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docrepo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docrepo}
      POSTGRES_DB: ${POSTGRES_DB:-docrepo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: docrepo_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    image: docrepo-backend
    container_name: docrepo_backend
    restart: unless-stopped
    # On start: prisma migrate deploy -> seed only if the DB is empty -> start the API.
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-docrepo}:${POSTGRES_PASSWORD:-docrepo}@postgres:5432/${POSTGRES_DB:-docrepo}?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-20}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-32-chars-min}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # Inlined into the browser bundle; the browser calls the API on the host's port 4000.
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    image: docrepo-frontend
    container_name: docrepo_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  # Uploaded files; survives restarts and `docker compose down` (removed only with `down -v`).
  uploads_data:
